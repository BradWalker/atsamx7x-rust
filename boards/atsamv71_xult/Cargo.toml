[package]
name = "atsamv71_xult"
version = "0.4.6"
edition = "2021"
authors = [
    "Viktor Sonesten <viktor.sonesten@grepit.se>"
]
license = "MIT OR Apache-2.0"

[dependencies]
cortex-m-rtic = "1.1.4"
cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
panic-rtt-target = { version = "0.1.2", features = ["cortex-m"] }
rtt-target = { version = "0.4.0" }
heapless = "0.7"
usbd-serial = "0.2.0"
systick-monotonic = "1.0.1"
rtic-monotonics = { version = "1.0", features = ["cortex-m-systick"] }
dwt-systick-monotonic = "1.1.0"
eeprom24x = "0.7.0"
atsamv71q21b = "0.33.5"

[dev-dependencies]
mcan = "0.2"
typenum = "1"

[dependencies.atsamx7x-hal]
version = "0.4"
path = "../../hal/"

features = ["samv71q21b", "rt", "unproven"]

[profile.dev]
debug = true
lto = true

[profile.release]
opt-level = 3          # Maximum compiler optimizations (default for release is 3 anyway)
lto = "fat"            # Enables whole-program optimization for LLVM to remove dead code and inline aggressively
codegen-units = 1      # Reduces codegen units to 1 for better optimizations (can increase compile time)
panic = 'abort'        # Removes stack unwinding logic for smaller and slightly faster binaries
strip = "debuginfo"    # Strips debug symbols from the final binary to make it smaller
# debug = true
